  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

--cyan:    oklch(72% 0.18 200);\n    --green:   oklch(72% 0.18 142);\n    --magenta: oklch(72% 0.18 330);\n    --amber:   oklch(72% 0.18 60);\n    --purple:  oklch(72% 0.18 280);\n    --coral:   oklch(72% 0.18 25);\n\n    /* Dim variants for backgrounds */\n    --cyan-dim:    oklch(72% 0.18 200 / 0.1);\n    --green-dim:   oklch(72% 0.18 142 / 0.1);\n    --magenta-dim: oklch(72% 0.18 330 / 0.1);\n    --amber-dim:   oklch(72% 0.18 60 / 0.1);\n    --purple-dim:  oklch(72% 0.18 280 / 0.1);\n    --coral-dim:   oklch(72% 0.18 25 / 0.1);\n\n    --text:      #e2e8f4;\n    --text-dim:  #8896b0;\n    --text-faint:#3d4d66;\n  }\n\n  * { margin: 0; padding: 0; box-sizing: border-box; }\n\n  body {\n    font-family: 'Oxanium', sans-serif;\n    font-weight: 400;\n    background-color: var(--bg);\n    background-image:\n      linear-gradient(rgba(100,160,255,0.03) 1px, transparent 1px),\n      linear-gradient(90deg, rgba(100,160,255,0.03) 1px, transparent 1px);\n    background-size: 28px 28px;\n    color: var(--text);\n    padding: 28px 20px 56px;\n    max-width: 840px;\n    margin: 0 auto;\n  }\n\n  /* ─── SCANLINE OVERLAY ─── */\n  body::before {\n    content: '';\n    position: fixed;\n    inset: 0;\n    background: repeating-linear-gradient(\n      0deg,\n      transparent,\n      transparent 3px,\n      rgba(0,0,0,0.06) 3px,\n      rgba(0,0,0,0.06) 4px\n    );\n    pointer-events: none;\n    z-index: 1000;\n  }\n\n  /* ─── CARD BASE ─── */\n  .card {\n    background: var(--surface);\n    border: 1px solid var(--border);\n    border-radius: 6px;\n    margin-bottom: 10px;\n    overflow: hidden;\n    position: relative;\n  }\n  .card::before {\n    content: '';\n    position: absolute;\n    inset: 0;\n    border-radius: 6px;\n    pointer-events: none;\n    z-index: 0;\n  }\n\n  /* ─── CARD HEADER ─── */\n  .card-header {\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    padding: 9px 14px;\n    border-bottom: 1px solid var(--border);\n    position: relative;\n  }\n  .card-header h2 {\n    font-family: 'Orbitron', sans-serif;\n    font-size: 11px;\n    font-weight: 700;\n    letter-spacing: 0.12em;\n    text-transform: uppercase;\n    position: relative;\n    z-index: 1;\n  }\n  .card-header .hicon {\n    font-size: 13px;\n    position: relative;\n    z-index: 1;\n  }\n  /* Accent bar on left edge of header */\n  .card-header::before {\n    content: '';\n    position: absolute;\n    left: 0; top: 0; bottom: 0;\n    width: 3px;\n    border-radius: 0;\n  }\n\n  .ch-cyan    { background: color-mix(in oklch, var(--cyan) 12%, var(--surface)); }\n  .ch-cyan    h2 { color: var(--cyan); }\n  .ch-cyan::before { background: var(--cyan); }\n\n  .ch-coral   { background: color-mix(in oklch, var(--coral) 12%, var(--surface)); }\n  .ch-coral   h2 { color: var(--coral); }\n  .ch-coral::before { background: var(--coral); }\n\n  .ch-amber   { background: color-mix(in oklch, var(--amber) 12%, var(--surface)); }\n  .ch-amber   h2 { color: var(--amber); }\n  .ch-amber::before { background: var(--amber); }\n\n  .ch-green   { background: color-mix(in oklch, var(--green) 12%, var(--surface)); }\n  .ch-green   h2 { color: var(--green); }\n  .ch-green::before { background: var(--green); }\n\n  .ch-purple  { background: color-mix(in oklch, var(--purple) 12%, var(--surface)); }\n  .ch-purple  h2 { color: var(--purple); }\n  .ch-purple::before { background: var(--purple); }\n\n  .ch-magenta { background: color-mix(in oklch, var(--magenta) 12%, var(--surface)); }\n  .ch-magenta h2 { color: var(--magenta); }\n  .ch-magenta::before { background: var(--magenta); }\n\n  .card-body { padding: 14px; position: relative; z-index: 1; }\n\n  /* ─── TOP HEADER ─── */\n  .top-bar {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    margin-bottom: 10px;\n    flex-wrap: wrap;\n    gap: 8px;\n  }\n  .top-left { display: flex; align-items: center; gap: 12px; }\n  .logo-img { width: 44px; height: 44px; object-fit: contain; border-radius: 8px; border: 1px solid var(--border-bright); }\n  .version-label {\n    font-family: 'Orbitron', sans-serif;\n    font-size: 8px;\n    font-weight: 600;\n    color: var(--text-dim);\n    letter-spacing: 0.12em;\n    line-height: 1.8;\n    text-transform: uppercase;\n  }\n  .version-label em { color: var(--cyan); font-style: normal; }\n\n  .header-pills { display: flex; gap: 6px; flex-wrap: wrap; }\n  .pill {\n    font-family: 'Orbitron', sans-serif;\n    font-size: 8.5px;\n    font-weight: 600;\n    letter-spacing: 0.06em;\n    padding: 5px 12px;\n    border-radius: 3px;\n    border: 1px solid var(--border-bright);\n    background: var(--surface2);\n    color: var(--text-dim);\n    white-space: nowrap;\n  }\n  .pill.cyan    { border-color: var(--cyan);    color: var(--cyan);    background: var(--cyan-dim); }\n  .pill.magenta { border-color: var(--magenta); color: var(--magenta); background: var(--magenta-dim); }\n\n  /* ─── NAME BANNER ─── */\n  .name-banner {\n    background: var(--surface);\n    border: 1px solid var(--border);\n    border-radius: 6px;\n    margin-bottom: 10px;\n    overflow: hidden;\n    position: relative;\n  }\n  .name-banner-header {\n    padding: 14px 18px;\n    border-bottom: 1px solid var(--border);\n    position: relative;\n    display: flex;\n    align-items: center;\n    gap: 16px;\n    background: linear-gradient(100deg, oklch(72% 0.18 200 / 0.12) 0%, transparent 60%);\n  }\n\n  /* ─── PROFILE PHOTO ─── */\n  .profile-photo {\n    width: 72px;\n    height: 72px;\n    object-fit: contain;\n    flex-shrink: 0;\n    position: relative;\n    z-index: 1;\n  }\n  /* Animated glow line at top */\n  .name-banner-header::before {\n    content: '';\n    position: absolute;\n    top: 0; left: 0; right: 0;\n    height: 1px;\n    background: linear-gradient(90deg, transparent, var(--cyan), var(--green), transparent);\n  }\n  .name-banner-header h1 {\n    font-family: 'Orbitron', sans-serif;\n    font-size: 22px;\n    font-weight: 900;\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    color: var(--text);\n    position: relative;\n    z-index: 1;\n  }\n  .name-banner-header h1 span { color: var(--cyan); }\n\n  .name-banner-body {\n    padding: 12px 18px;\n    display: flex;\n    justify-content: space-between;\n    align-items: center;\n    flex-wrap: wrap;\n    gap: 12px;\n  }\n  .tagline {\n    font-family: 'Orbitron', sans-serif;\n    font-size: 8.5px;\n    font-weight: 700;\n    letter-spacing: 0.12em;\n    text-transform: uppercase;\n    color: var(--magenta);\n    margin-bottom: 5px;\n  }\n  .contact-line {\n    font-size: 10.5px;\n    color: var(--text-dim);\n    letter-spacing: 0.02em;\n  }\n  .contact-line a { color: var(--cyan); text-decoration: none; }\n\n  .stat-row { display: flex; gap: 6px; flex-wrap: wrap; }\n  .stat-box {\n    border: 1px solid var(--border-bright);\n    border-radius: 4px;\n    padding: 8px 12px;\n    text-align: center;\n    min-width: 58px;\n    background: var(--surface2);\n    position: relative;\n    overflow: hidden;\n  }\n  .stat-box::before {\n    content: '';\n    position: absolute;\n    top: 0; left: 0; right: 0;\n    height: 1px;\n    background: var(--cyan);\n    opacity: 0.5;\n  }\n  .stat-num {\n    font-family: 'Orbitron', sans-serif;\n    font-size: 13px;\n    font-weight: 700;\n    color: var(--cyan);\n    display: block;\n  }\n  .stat-label {\n    font-size: 7px;\n    font-weight: 600;\n    color: var(--text-dim);\n    text-transform: uppercase;\n    letter-spacing: 0.08em;\n    display: block;\n    margin-top: 2px;\n  }\n\n  /* ─── PROFILE ─── */\n  .profile-text { font-size: 12px; line-height: 1.78; color: var(--text-dim); }\n  .profile-text strong { font-weight: 700; color: var(--cyan); }\n\n  /* ─── ROLE ENTRIES ─── */\n  .role-entry {\n    background: var(--surface2);\n    border: 1px solid var(--border);\n    border-radius: 4px;\n    padding: 12px 14px;\n    margin-bottom: 9px;\n    position: relative;\n  }\n  .role-entry:last-child { margin-bottom: 0; }\n  .role-entry::before {\n    content: '';\n    position: absolute;\n    left: 0; top: 0; bottom: 0;\n    width: 2px;\n    background: var(--entry-accent, var(--cyan));\n    border-radius: 4px 0 0 4px;\n    opacity: 0.7;\n  }\n\n  .role-top {\n    display: flex;\n    justify-content: space-between;\n    align-items: flex-start;\n    margin-bottom: 3px;\n    flex-wrap: wrap;\n    gap: 4px;\n  }\n  .role-title {\n    font-family: 'Oxanium', sans-serif;\n    font-weight: 700;\n    font-size: 12.5px;\n  }\n  .role-title .title-role { color: var(--text); }\n  .role-title .title-sep  { color: var(--text-faint); margin: 0 4px; font-weight: 400; }\n  .role-title .title-org  { color: var(--entry-accent, var(--cyan)); font-weight: 700; }\n  .role-date {\n    font-family: 'Orbitron', sans-serif;\n    font-size: 8px;\n    font-weight: 600;\n    color: var(--cyan);\n    background: var(--cyan-dim);\n    padding: 3px 9px;\n    border-radius: 3px;\n    border: 1px solid oklch(72% 0.18 200 / 0.3);\n    white-space: nowrap;\n    letter-spacing: 0.06em;\n  }\n  .role-company {\n    font-size: 9.5px;\n    font-weight: 600;\n    color: var(--text-faint);\n    margin-bottom: 7px;\n    font-family: 'Orbitron', sans-serif;\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n  }\n\n  .accent-badge {\n    display: inline-block;\n    font-family: 'Orbitron', sans-serif;\n    font-size: 7px;\n    font-weight: 700;\n    letter-spacing: 0.1em;\n    padding: 3px 9px;\n    border-radius: 3px;\n    border: 1px solid;\n    margin-bottom: 8px;\n    text-transform: uppercase;\n  }\n  .badge-cyan    { background: var(--cyan-dim);    color: var(--cyan);    border-color: oklch(72% 0.18 200 / 0.35); }\n  .badge-magenta { background: var(--magenta-dim); color: var(--magenta); border-color: oklch(72% 0.18 330 / 0.35); }\n  .badge-coral   { background: var(--coral-dim);   color: var(--coral);   border-color: oklch(72% 0.18 25 / 0.35); }\n  .badge-amber   { background: var(--amber-dim);   color: var(--amber);   border-color: oklch(72% 0.18 60 / 0.35); }\n  .badge-green   { background: var(--green-dim);   color: var(--green);   border-color: oklch(72% 0.18 142 / 0.35); }\n  .badge-purple  { background: var(--purple-dim);  color: var(--purple);  border-color: oklch(72% 0.18 280 / 0.35); }\n\n  .role-bullets { list-style: none; display: flex; flex-direction: column; gap: 4px; }\n  .role-bullets li {\n    font-size: 11px;\n    line-height: 1.58;\n    padding-left: 15px;\n    position: relative;\n    color: var(--text-dim);\n  }\n  .role-bullets li::before {\n    content: '›';\n    position: absolute;\n    left: 0;\n    color: var(--entry-accent, var(--cyan));\n    font-size: 14px;\n    top: -1px;\n    font-weight: 700;\n  }\n\n  /* ─── TWO COL ─── */\n  .two-col {\n    display: grid;\n    grid-template-columns: 1fr 1fr;\n    gap: 10px;\n  }\n  .col-stack { display: flex; flex-direction: column; gap: 10px; }\n  .col-stack .card { margin-bottom: 0; }\n\n  /* ─── SECTION LABEL ─── */\n  .section-label {\n    font-family: 'Orbitron', sans-serif;\n    font-size: 7px;\n    font-weight: 700;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: var(--text-faint);\n    margin-bottom: 6px;\n    margin-top: 2px;\n  }\n\n  /* ─── CLIENT TAGS ─── */\n  .client-grid { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }\n  .client-tag {\n    font-size: 10.5px;\n    font-weight: 600;\n    padding: 4px 10px;\n    border: 1px solid;\n    border-radius: 3px;\n  }\n  .client-tag.f1    { background: var(--cyan-dim);    border-color: oklch(72% 0.18 200 / 0.3); color: var(--cyan); }\n  .client-tag.media { background: var(--coral-dim);   border-color: oklch(72% 0.18 25 / 0.3);  color: var(--coral); }\n  .client-tag.brand { background: var(--amber-dim);   border-color: oklch(72% 0.18 60 / 0.3);  color: var(--amber); }\n\n  /* ─── SKILLS ─── */\n  .skill-list { display: flex; flex-wrap: wrap; gap: 5px; }\n  .skill-tag {\n    font-size
